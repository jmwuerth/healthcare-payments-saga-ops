name: Healthcare Payments CI/CD Quality Gate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Build & Run Concurrency/Guardrail Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore (locked mode - fails on stale or tampered lockfiles)
        run: dotnet restore HealthcarePayments.sln --locked-mode
      - name: Build (Treat Warnings as Errors)
        run: dotnet build HealthcarePayments.sln --configuration Release --no-restore -warnaserror
      - name: Execute xUnit Saga, Pipeline & AI Guardrail Gates
        run: dotnet test HealthcarePayments.sln --configuration Release --no-build --verbosity normal

  angular-build:
    name: Angular Template Build & Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NG_CLI_ANALYTICS: 'false'
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js 24 LTS
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'
      - name: Install Dependencies
        working-directory: frontend
        run: npm ci
      - name: Build (AOT Template Typecheck)
        working-directory: frontend
        run: npx ng build
