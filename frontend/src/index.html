<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- Strict CSP: no third-party scripts, no cross-origin data exfiltration beyond the local API/mock.
       Note: frame-ancestors is inert when delivered via <meta> (spec); it is kept here as intent and
       must also be sent as an HTTP header by the hosting layer to actually take effect. -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self' http://localhost:3000 http://localhost:5065; frame-ancestors 'none'; base-uri 'self'">
  <title>Healthcare Payments Saga Ops</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
</head>

</body>
</html>
